<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 70 800 640" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
  <g fill="#ffffff">
    <circle cx="400" cy="250" r="161"/>
    <circle cx="260" cy="390" r="161"/>
