  <text x="400" y="160" font-size="22" font-weight="bold" fill="#222">Ce que vous aimez</text>
  <text x="400" y="188" font-size="16" fill="#444">1. Explorer : en graine</text>
  <text x="400" y="210" font-size="16" fill="#444">3. Contrôle : en grand</text>

  <text x="180" y="398" font-size="22" font-weight="bold" fill="#222">Doué</text>

  <text x="612" y="352" font-size="22" font-weight="bold" fill="#222">Ce dont</text>
  <text x="612" y="378" font-size="22" font-weight="bold" fill="#222">le monde</text>
  <text x="612" y="404" font-size="22" font-weight="bold" fill="#222">a besoin</text>
  <text x="612" y="430" font-size="16" fill="#444">4. Mission</text>

  <text x="400" y="608" font-size="22" font-weight="bold" fill="#222">Bien payé</text>
  <text x="400" y="634" font-size="16" fill="#444">une fois rare</text>

  <text x="318" y="476" font-size="16" font-weight="bold" fill="#333">2. Maîtriser</text>

  <circle cx="400" cy="390" r="46" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="386" font-size="16" font-weight="bold" fill="#222">Ikigai</text>
  <text x="400" y="406" font-size="13" fill="#444">l'arrivée</text>

