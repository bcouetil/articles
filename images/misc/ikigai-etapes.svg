  </g>
  <circle cx="400" cy="250" r="160" fill="#e8a0a0" fill-opacity="0.45" stroke="#c47a7a" stroke-width="2"/>
  <circle cx="260" cy="390" r="160" fill="#9dbbe3" fill-opacity="0.45" stroke="#6a86b8" stroke-width="2"/>
  <circle cx="540" cy="390" r="160" fill="#f3d27a" fill-opacity="0.45" stroke="#c9a13d" stroke-width="2"/>
